# Portage repository configuration for the unifi-mcp-server-overlay.
#
# Install by copying this file to (as root):
#     /etc/portage/repos.conf/unifi-mcp-server-overlay.conf
#
# The repo name below MUST match profiles/repo_name in the overlay
# (unifi-mcp-server-overlay). After installing, run `emerge --sync
# unifi-mcp-server-overlay` (git sync) or just point `location` at your
# existing local clone.
#
# This overlay declares `masters = gentoo`, so ::gentoo must also be
# configured (it always is on a normal system).

[unifi-mcp-server-overlay]

# --- Option A: sync from GitHub (recommended for a deployed system) ---
location = /var/db/repos/unifi-mcp-server-overlay
sync-type = git
sync-uri = https://github.com/jonesmz/unifi-mcp-server-overlay.git
auto-sync = yes
clone-depth = 1
sync-depth = 100

# --- Option B: use the existing working clone directly (no sync) ---
# If you would rather point Portage at the clone you already have in
# ScratchWork, comment out the location/sync-* lines above and use:
#
# location = /home/jonesmz/ScratchWork/unifi-mcp-server-overlay
# auto-sync = no
